name: Build Mastery App (Android + iOS)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and install dependencies
        run: bash setup.sh

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Mastery-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Build iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project and install dependencies
        run: bash setup.sh

      - name: Build iOS device app without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/Mastery-iOS-Unsigned-App.zip"

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Mastery-iOS-Unsigned-App
          path: Mastery-iOS-Unsigned-App.zip
          if-no-files-found: error
