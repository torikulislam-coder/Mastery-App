name: Build Mastery App
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mastery-APK
          path: dist/Mastery.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mastery-Web
          path: dist/web
